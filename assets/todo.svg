<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-label="todo — a checklist and a note">
  <!-- card -->
  <rect width="600" height="500" fill="#000000"/>
  <rect x="1.5" y="1.5" width="597" height="497" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="3"/>

  <!-- note page peeking out behind the checklist, bottom-right -->
  <g>
    <rect x="418" y="130" width="120" height="160" fill="#000000" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <path d="M538 130 L510 130 L538 158 Z" fill="rgba(255,255,255,0.25)"/>
    <rect x="434" y="180" width="72" height="7" fill="rgba(255,255,255,0.35)"/>
    <rect x="434" y="200" width="88" height="7" fill="rgba(255,255,255,0.2)"/>
    <rect x="434" y="220" width="60" height="7" fill="rgba(255,255,255,0.2)"/>
    <rect x="434" y="240" width="80" height="7" fill="rgba(255,255,255,0.12)"/>
  </g>

  <!-- checklist card -->
  <rect x="62" y="62" width="380" height="216" fill="#000000" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>

  <!-- row 1 — checked, sage -->
  <rect x="63" y="63" width="5" height="70" fill="#6b8a72"/>
  <rect x="92" y="86" width="24" height="24" fill="#ffffff"/>
  <path d="M97 98 L103 104 L112 92" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="square"/>
  <rect x="140" y="93" width="180" height="10" fill="rgba(255,255,255,0.4)"/>
  <line x1="63" y1="134" x2="441" y2="134" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- row 2 — checked, slate-blue -->
  <rect x="63" y="135" width="5" height="70" fill="#5b7a8a"/>
  <rect x="92" y="158" width="24" height="24" fill="#ffffff"/>
  <path d="M97 170 L103 176 L112 164" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="square"/>
  <rect x="140" y="165" width="228" height="10" fill="rgba(255,255,255,0.4)"/>
  <line x1="63" y1="206" x2="441" y2="206" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- row 3 — open, plum -->
  <rect x="63" y="207" width="5" height="70" fill="#7a5b78"/>
  <rect x="93" y="231" width="22" height="22" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <rect x="140" y="237" width="152" height="10" fill="rgba(255,255,255,0.85)"/>

  <!-- wordmark -->
  <text x="300" y="392" text-anchor="middle" fill="#ffffff" font-family="Poppins, ui-sans-serif, system-ui, sans-serif" font-size="60" font-weight="600">todo</text>
  <text x="300" y="438" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">CATEGORIES · TASKS · NOTES</text>
</svg>
